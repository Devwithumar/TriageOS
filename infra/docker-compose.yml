services:
  voice:
    build:
      context: ..
      dockerfile: services/voice/Dockerfile
    environment:
      CONVERSATION_SERVICE_URL: http://conversation:8001
    ports:
      - "8080:8000"
    depends_on:
      - conversation

  conversation:
    build:
      context: ..
      dockerfile: services/conversation/Dockerfile
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CONVERSATION_REPOSITORY: postgres
      DATABASE_URL: postgresql://triageos:triageos@postgres:5432/triageos
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: triageos
      POSTGRES_USER: triageos
      POSTGRES_PASSWORD: triageos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triageos -d triageos"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  postgres-data:
