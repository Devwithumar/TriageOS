<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TriageOS Voice Engine</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <aside class="panel">
          <div>
            <p class="eyebrow">TriageOS Phase 1</p>
            <h1>Voice Engine</h1>
            <p class="status" id="connectionStatus">Disconnected</p>
          </div>
          <div class="controls">
            <button id="connectButton" type="button">Connect</button>
            <button id="talkButton" type="button" disabled>Start Talking</button>
            <button id="stopButton" type="button" disabled>Stop</button>
          </div>
          <dl class="metrics">
            <div>
              <dt>Session</dt>
              <dd id="sessionId">-</dd>
            </div>
            <div>
              <dt>Latency</dt>
              <dd id="latency">-</dd>
            </div>
          </dl>
        </aside>

        <section class="conversation" aria-live="polite">
          <div class="transcript" id="transcript"></div>
          <div>
            <div class="voice-stage" id="voiceStage" data-mode="idle">
              <div class="waveform" id="waveform" aria-label="Microphone activity" role="img">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
              </div>
              <p class="activity-label" id="activityLabel">Ready when you are</p>
              <p class="activity-detail" id="activityDetail">Connect to start a private voice session.</p>
              <p class="live-transcript" id="liveTranscript" aria-live="polite" hidden></p>
            </div>
            <p class="hint" id="hint">Connect, then speak or type to start the first TriageOS voice loop.</p>
            <form class="composer" id="composer">
              <input id="messageInput" type="text" autocomplete="off" placeholder="Type a message instead..." disabled />
              <button id="sendButton" type="submit" disabled>Send</button>
            </form>
          </div>
        </section>
      </section>
    </main>
    <script src="/static/app.js?v=4"></script>
  </body>
</html>
